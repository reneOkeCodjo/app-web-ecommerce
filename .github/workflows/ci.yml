name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Syntaxe et tests unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, mbstring, fileinfo
          coverage: none

      - name: Installer les dépendances
        uses: ramsey/composer-install@v3

      - name: Vérifier la syntaxe PHP
        run: |
          find src config public tests database -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: Lancer les tests unitaires
        run: vendor/bin/phpunit --testsuite "Unit tests" --no-coverage
